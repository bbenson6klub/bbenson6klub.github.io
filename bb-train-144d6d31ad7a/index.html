  function onAppChange(ev) {
    var t = ev.target;
    var act = t.getAttribute("data-act");
    if (!act) return;
    if (act === "set-done") {
      setSet(state.week, state.day, t.getAttribute("data-ex"), Number(t.getAttribute("data-i")), { done: t.checked });
      var row = t.closest(".set-row");
      if (row) row.classList.toggle("done", t.checked);
      updateSessionProgress();
      return;
    }
    if (act === "set-wt") {
      setSet(state.week, state.day, t.getAttribute("data-ex"), Number(t.getAttribute("data-i")), { weight: t.value });
      return;
    }
    if (act === "set-reps") {
      setSet(state.week, state.day, t.getAttribute("data-ex"), Number(t.getAttribute("data-i")), { reps: t.value });
      return;
    }
    if (act === "set-rir") {
      setSet(state.week, state.day, t.getAttribute("data-ex"), Number(t.getAttribute("data-i")), { rir: t.value });
      return;
    }
    if (act === "set-time") {
      setSet(state.week, state.day, t.getAttribute("data-ex"), Number(t.getAttribute("data-i")), { time: t.value });
      return;
    }
    if (act === "set-band") {
      setSet(state.week, state.day, t.getAttribute("data-ex"), 0, { band: t.value });
      return;
    }
    if (act === "set-notes") {
      setSet(state.week, state.day, t.getAttribute("data-ex"), 0, { notes: t.value });
      return;
    }
    if (act === "shot-m" || act === "shot-a") {
      var key = kShot(state.week, state.day, t.getAttribute("data-spot"));
      var rowS = state.shooting[key] || { makes: "", atts: "" };
      if (act === "shot-m") rowS.makes = t.value;
      else rowS.atts = t.value;
      state.shooting[key] = rowS;
      persist();
      updateShotPct(t.getAttribute("data-spot"), rowS);
      return;
    }
    if (act === "jump-res" || act === "jump-notes") {
      var jk = dailyKey();
      var jr = state.jumps[jk] || { resistance: "", notes: "" };
      if (act === "jump-res") jr.resistance = t.value;
      else jr.notes = t.value;
      state.jumps[jk] = jr;
      persist();
      return;
    }
    if (act === "cond-time" || act === "cond-notes") {
      var ck = dailyKey();
      var cr = state.cond[ck] || { time: "", notes: "" };
      if (act === "cond-time") cr.time = t.value;
      else cr.notes = t.value;
      state.cond[ck] = cr;
      persist();
      return;
    }
    if (act === "daily-bw" || act === "daily-sleep" || act === "daily-sauna" || act === "daily-boots" || act === "daily-plunge" || act === "daily-boots" || act === "daily-plunge") {
      var dk = dailyKey();
      var dr = state.daily[dk] || { bw: "", sleep: "", sauna: "", boots: "", plunge: "" };
      if (act === "daily-bw") dr.bw = t.value;
      else if (act === "daily-sleep") dr.sleep = t.value;
      else if (act === "daily-sauna") dr.sauna = t.value;
      else if (act === "daily-boots") dr.boots = t.value;
      else dr.plunge = t.value;
      state.daily[dk] = dr;
      persist();
      return;
    }
    if (act === "test-slot") {
      state.testSlot = t.value;
      persist();
      render();
      return;
    }
    if (act === "test-f") {
      var slot = state.testSlot;
      if (!state.tests[slot]) state.tests[slot] = { standing: "", jump: "", approach: "" };
      state.tests[slot][t.getAttribute("data-f")] = t.value;
      persist();
      return;
    }
    if (act === "ci-date") { state.ciDate = t.value; persist(); return; }
    if (act === "ci-weight") { state.ciWeight = t.value; persist(); return; }
    if (act === "ci-feet") { state.ciFeet = t.value; persist(); return; }
    if (act === "ci-inches") { state.ciInches = t.value; persist(); return; }
    if (act === "start-date") { state.startDate = t.value || ""; persist(); return; }
  }

  function updateShotPct(id, row) {
    var m = parseNum(row.makes);
    var a = parseNum(row.atts);
    var el = document.querySelector('[data-spot-pct="' + id + '"]');
    var taken = (m === null && a === null) ? null : Math.max(a || 0, m || 0);
    var made = m === null ? null : Math.max(0, m);
    if (el) el.textContent = (taken && taken > 0 && made !== null) ? Math.round((made / taken) * 100) + "%" : "—";
    var totEl = document.getElementById("session-pct");
    var tot = sessionShooting(planFor(phaseFor(state.week), state.day, state.week));
    if (totEl) totEl.textContent = tot ? ("Today: " + tot.made + "/" + tot.taken + " · " + tot.pct + "%") : "Enter makes and attempts to see make %.";
  }

  function onAppClick(ev) {
    var t = ev.target.closest("[data-act]");
    if (!t) return;
    var act = t.getAttribute("data-act");
    if (act === "ci-add") {
      ev.preventDefault();
      var w = parseNum(state.ciWeight);
      var ft = parseNum(state.ciFeet);
      var inch = parseNum(state.ciInches);
      if (w === null || w <= 0 || ft === null || inch === null) return;
      var total = Math.round(ft * 12 + inch);
      if (total < 0) total = 0;
      var date = (state.ciDate || "").trim() || todayISO();
      state.checkIns.push({
        id: date + "-" + Date.now(),
        date: date,
        weight: w,
        feet: Math.floor(total / 12),
        inches: total % 12
      });
      state.ciWeight = "";
      persist();
      render();
      return;
    }
    if (act === "ci-remove") {
      ev.preventDefault();
      if (state.checkIns.length) state.checkIns.pop();
      persist();
      render();
    }
  }

  function exportJSON() {
    var blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "blake-offseason-tracker-backup-" + todayISO() + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 500);
  }

  function copyJSON() {
    var text = JSON.stringify(state, null, 2);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        setSaveStatus("JSON copied");
      }).catch(function () { fallbackCopy(text); });
    } else fallbackCopy(text);
  }

  function fallbackCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.left = "-9999px";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); setSaveStatus("JSON copied"); }
    catch (e) { setSaveStatus("Copy failed — use Export"); }
    document.body.removeChild(ta);
  }

  function importJSON(file) {
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var data = JSON.parse(String(reader.result));
        if (!data || typeof data !== "object" || Array.isArray(data)) throw new Error("bad");
        var next = defaultState();
        var key;
        for (key in data) {
          if (Object.prototype.hasOwnProperty.call(data, key)) next[key] = data[key];
        }
        if (!next.sets || typeof next.sets !== "object" || Array.isArray(next.sets)) next.sets = {};
        if (!Array.isArray(next.checkIns)) next.checkIns = [];
        next.version = 1;
        state = next;
        persist();
        render();
        setSaveStatus("Imported backup");
      } catch (err) {
        setSaveStatus("Import failed — use a tracker JSON file");
      }
    };
    reader.readAsText(file);
  }

  document.getElementById("app").addEventListener("change", function (e) {
    var act = e.target.getAttribute("data-act");
    if (act === "import-file") {
      var file = e.target.files && e.target.files[0];
      importJSON(file);
      e.target.value = "";
      return;
    }
    onAppChange(e);
  });
  document.getElementById("app").addEventListener("input", function (e) {
    var act = e.target.getAttribute("data-act");
    if (act === "shot-m" || act === "shot-a" || act === "set-wt" || act === "set-reps" || act === "set-rir" || act === "set-time" || act === "set-band" || act === "set-notes" || act === "daily-bw" || act === "daily-sleep" || act === "daily-sauna" || act === "ci-weight" || act === "ci-feet" || act === "ci-inches" || act === "ci-date" || act === "jump-res" || act === "jump-notes" || act === "cond-time" || act === "cond-notes" || act === "test-f" || act === "start-date") {
      onAppChange(e);
    }
  });
  document.getElementById("app").addEventListener("click", handleShellClick);
  document.getElementById("tabbar").addEventListener("click", handleShellClick);
  document.getElementById("app").addEventListener("touchstart", onSwipeStart, { passive: true });
  document.getElementById("app").addEventListener("touchend", onSwipeEnd, { passive: true });

  try {
    localStorage.setItem(STORAGE_KEY, localStorage.getItem(STORAGE_KEY) || JSON.stringify(state));
    persistUi();
    saveOk = true;
  } catch (err) {
    saveOk = false;
  }
  render();
  initSyncListeners();
})();
  </script>
</body>
</html>
