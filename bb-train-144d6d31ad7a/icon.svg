<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Blake Training</title>
  <rect width="512" height="512" fill="#080809"/>
  <defs>
    <radialGradient id="ballFill" cx="36%" cy="30%" r="72%">
      <stop offset="0%" stop-color="#ffd56a"/>
      <stop offset="38%" stop-color="#ffb020"/>
      <stop offset="78%" stop-color="#ff8a1a"/>
      <stop offset="100%" stop-color="#c45600"/>
    </radialGradient>
    <linearGradient id="barFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b8fff0"/>
      <stop offset="42%" stop-color="#2ee6c5"/>
      <stop offset="100%" stop-color="#128f7a"/>
    </linearGradient>
    <linearGradient id="plateFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8ffff0"/>
      <stop offset="35%" stop-color="#2ee6c5"/>
      <stop offset="100%" stop-color="#0b6f60"/>
    </linearGradient>
    <clipPath id="ballClip">
      <circle cx="256" cy="256" r="172"/>
    </clipPath>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Basketball -->
  <circle cx="256" cy="256" r="172" fill="url(#ballFill)"/>
  <g clip-path="url(#ballClip)" fill="none" stroke="#2a1400" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <path d="M256 84 V428"/>
    <path d="M84 256 H428"/>
    <path d="M256 84 C148 162 148 350 256 428"/>
    <path d="M256 84 C364 162 364 350 256 428"/>
  </g>
  <!-- subtle rim to keep the ball crisp on dark -->
  <circle cx="256" cy="256" r="172" fill="none" stroke="#3a1a00" stroke-width="3" opacity="0.55"/>

  <!-- Dumbbell crossing in front, slight diagonal -->
  <g transform="translate(256 256) rotate(-30)" filter="url(#softShadow)">
    <!-- left plates (outer then inner) -->
    <rect x="-214" y="-58" width="28" height="116" rx="10" fill="url(#plateFill)" stroke="#041411" stroke-width="6"/>
    <rect x="-182" y="-50" width="24" height="100" rx="9" fill="url(#plateFill)" stroke="#041411" stroke-width="6"/>
    <!-- right plates -->
    <rect x="186" y="-58" width="28" height="116" rx="10" fill="url(#plateFill)" stroke="#041411" stroke-width="6"/>
    <rect x="158" y="-50" width="24" height="100" rx="9" fill="url(#plateFill)" stroke="#041411" stroke-width="6"/>
    <!-- handle -->
    <rect x="-158" y="-16" width="316" height="32" rx="16" fill="url(#barFill)" stroke="#041411" stroke-width="6"/>
    <!-- collars -->
    <rect x="-154" y="-22" width="16" height="44" rx="5" fill="#d8fff6" stroke="#041411" stroke-width="5"/>
    <rect x="138" y="-22" width="16" height="44" rx="5" fill="#d8fff6" stroke="#041411" stroke-width="5"/>
    <!-- grip marks, bold enough to survive downscale -->
    <g stroke="#0b6f60" stroke-width="4" stroke-linecap="round" opacity="0.7">
      <line x1="-28" y1="-8" x2="-28" y2="8"/>
      <line x1="-10" y1="-8" x2="-10" y2="8"/>
      <line x1="8" y1="-8" x2="8" y2="8"/>
      <line x1="26" y1="-8" x2="26" y2="8"/>
    </g>
    <!-- bar highlight -->
    <rect x="-140" y="-10" width="280" height="7" rx="3.5" fill="#ffffff" opacity="0.28"/>
  </g>
</svg>
