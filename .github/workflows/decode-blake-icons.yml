name: Decode Blake trainer icons
on:
  push:
    paths:
      - "bb-train-144d6d31ad7a/icon-src/**"
      - ".github/workflows/decode-blake-icons.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode icons
        run: |
          python3 - << 'PY'
          from pathlib import Path
          import base64
          src = Path("bb-train-144d6d31ad7a/icon-src")
          dest = Path("bb-train-144d6d31ad7a")
          for p in sorted(src.glob("*.b64")):
              name = p.name[:-4]
              data = base64.b64decode("".join(p.read_text().split()))
              out = dest / name
              out.write_bytes(data)
              print("wrote", out, len(data))
          PY
      - name: Commit rendered icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bb-train-144d6d31ad7a/*.png bb-train-144d6d31ad7a/*.ico
          if git diff --cached --quiet; then
            echo "no icon changes"
            exit 0
          fi
          git commit -m "Add rendered basketball-dumbbell icon PNGs"
          git push
